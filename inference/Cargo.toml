[package]
name = "inference"
version = "0.1.0"
edition = "2021"
description = "Practical LLM inference engineering lessons in Rust"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
candle-core = { git = "https://github.com/huggingface/candle.git", optional = true }
candle-nn = { git = "https://github.com/huggingface/candle.git", optional = true }
candle-transformers = { git = "https://github.com/huggingface/candle.git", optional = true }
cudarc = { version = "0.19.8", features = ["driver", "nvrtc", "cublas", "nccl", "cuda-version-from-build-system"], optional = true }
hf-hub = { version = "0.4", optional = true }
memmap2 = "0.9.11"
rand = "0.10.2"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig", "http"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub"]
candle-cuda = ["candle", "candle-core/cuda"]
gpu = ["dep:cudarc"]

[dev-dependencies]
criterion = "0.8.2"
