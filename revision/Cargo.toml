[package]
name = "revision"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false
autoexamples = false

# every .rs lesson is its own binary. run one with ./run <file>,
# or cargo run --bin <file stem>.

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_imports = "allow"

