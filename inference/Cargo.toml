[package]
name = "inference"
version = "0.1.0"
edition = "2021"
description = "Practical LLM inference engineering lessons in Rust"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
candle-core = { git = "https://github.com/huggingface/candle.git", features = ["cuda"] }
candle-nn = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
cudarc = { version = "0.19.8", features = ["driver", "nvrtc", "cublas", "cuda-version-from-build-system"] }
hf-hub = "0.4"
memmap2 = "0.9.11"
rand = "0.10.2"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig", "http"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.8.2"

[[example]]
name = "01_inference_system"
path = "candle/01_inference_system.rs"
[[example]]
name = "02_tensors_devices_and_dtypes"
path = "candle/02_tensors_devices_and_dtypes.rs"
[[example]]
name = "03_model_loading"
path = "candle/03_model_loading.rs"
[[example]]
name = "04_llama_execution"
path = "candle/04_llama_execution.rs"
[[example]]
name = "05_generation_and_sampling"
path = "candle/05_generation_and_sampling.rs"
[[example]]
name = "06_kv_cache"
path = "candle/06_kv_cache.rs"
[[example]]
name = "07_quantized_inference"
path = "candle/07_quantized_inference.rs"
[[example]]
name = "08_profiling_and_extension_points"
path = "candle/08_profiling_and_extension_points.rs"
[[example]]
name = "09_request_lifecycle"
path = "systems/09_request_lifecycle.rs"
[[example]]
name = "10_batching_and_streaming"
path = "systems/10_batching_and_streaming.rs"
[[example]]
